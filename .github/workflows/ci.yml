name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --group dev --group spark
      - name: Lint
        run: uv run ruff check .
      - name: Tests (notebook, app consistency, reproducibility, local Spark pipeline)
        run: uv run pytest
